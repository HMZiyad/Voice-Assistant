<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemi | Voice Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header>
            <div class="logo">
                <i class="fa-solid fa-sparkles"></i> Gemi
            </div>
            <div class="status-badge" id="status-indicator">Ready</div>
        </header>

        <main>
            <div class="chat-window" id="chat-window">
                <!-- Messages will appear here -->
                <div class="message ai-message">
                    <div class="message-content">
                        Hi there! I'm Gemi. Click the microphone to start chatting.
                    </div>
                </div>
            </div>

            <div class="controls">
                <button id="mic-btn" class="mic-button">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <div class="wave-container" id="wave-container">
                    <!-- CSS animated sound wave bars -->
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                    <div class="bar"></div>
                </div>
            </div>
            <p class="instruction-text" id="instruction-text">Tap to speak</p>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
